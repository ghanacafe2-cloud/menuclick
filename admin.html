<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Kiosco El Cholo</title>
    <style>
      body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #121212; color: #e0e0e0; padding: 20px; }
.container { max-width: 1000px; margin: auto; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
h3 { color: #fbc02d; border-bottom: 1px solid #333; padding-bottom: 10px; }

/* Tarjetas de Reporte tipo Dashboard */
.grid-reporte { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 20px 0; }
.caja { background: #252525; padding: 20px; border-radius: 10px; text-align: center; border-left: 5px solid #fbc02d; transition: 0.3s; }
.caja:hover { transform: translateY(-5px); background: #2d2d2d; }
.caja b { font-size: 1.5rem; display: block; margin-top: 10px; color: #fff; }

/* Tabla estilo Profesional */
table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #252525; border-radius: 8px; overflow: hidden; }
th { background: #333; color: #fbc02d; padding: 15px; text-align: left; text-transform: uppercase; font-size: 0.8rem; }
td { padding: 15px; border-bottom: 1px solid #333; }
tr:hover { background: #2d2d2d; }

/* Badges de Stock */
.status-ok { color: #4caf50; font-weight: bold; }
.status-low { color: #f44336; font-weight: bold; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.5; } }

/* Botones y Formularios */
input, select { background: #333; border: 1px solid #444; color: white; padding: 12px; border-radius: 6px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
.btn-save { background: #fbc02d; color: #121212; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
.btn-save:hover { background: #f9a825; }
    </style>
</head>
<body>

<div class="container">
    <button class="btn-nav" onclick="window.location.href='index.html'">⬅ VOLVER AL MOSTRADOR</button>

    <h3>📊 CIERRE DE CAJA DIARIO</h3>
    <div class="grid-reporte">
        <div class="caja">
            <p>💵 Efectivo</p>
            <b id="total-efectivo">$0,00</b>
        </div>
        <div class="caja">
            <p>💳 Tarjeta</p>
            <b id="total-debito">$0,00</b>
        </div>
        <div class="caja">
            <p>📱 QR / MP</p>
            <b id="total-qr">$0,00</b>
        </div>
    </div>
    <div class="total-dia">
        TOTAL DEL DÍA: <span id="total-general">$0,00</span>
    </div>
    <button class="btn-danger" onclick="borrarVentas()">🗑️ REINICIAR CAJA DIARIA</button>

    <hr style="margin: 40px 0;">
    <div style="background: #fdf2e9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e67e22;">
    <label>🔑 <strong>GitHub Token:</strong></label>
    <div style="display: flex; gap: 10px; margin-top: 8px;">
        <input type="password" id="gh-token" placeholder="Pegar Token aquí..." style="flex: 1;">
      <button type="button" onclick="guardarToken()" style="background: #e67e22; width: auto;">Validar</button>
<button type="button" onclick="borrarToken()" style="background: #95a5a6; width: auto;">Limpiar</button>

<button type="button" id="btn-guardar" class="btn-save" onclick="guardarProducto()">💾 GUARDAR EN LISTA</button>
    </div>
    <small id="token-status" style="font-weight: bold;"></small>
</div>

    <h3>🆕 CARGAR PRODUCTO NUEVO</h3>
    <input type="text" id="admin-codigo" placeholder="Escanear código..." autofocus>
    <input type="text" id="admin-nombre" placeholder="Nombre del Producto">
    <input type="number" id="admin-precio" placeholder="Precio $">
    <select id="admin-tipo">
        <option value="fijo">Precio Fijo</option>
        <option value="variable">Precio Variable (Pan/Fiambre)</option>
    </select>
 <button class="btn-save" onclick="guardarProducto()">💾 GUARDAR EN LISTA</button>

    <hr style="margin: 40px 0;">

    <h3>📋 LISTA DE PRECIOS</h3>
    <table id="tabla-productos">
        <thead>
            <tr>
                <th>Código</th>
                <th>Producto</th>
                <th>Precio</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
    <hr style="border-color: #333; margin: 40px 0;">
<h3>👥 LIBRETA DE FIADOS</h3>
<div style="display: flex; gap: 10px; margin-bottom: 20px;">
    <input type="text" id="fiado-cliente" placeholder="Nombre del Cliente" style="flex: 2;">
    <input type="number" id="fiado-monto" placeholder="Monto $" style="flex: 1;">
    <button onclick="agregarFiado()" class="btn-save" style="flex: 1; margin-bottom: 10px;">➕ ANOTAR</button>
</div>
<table id="tabla-fiados">
    <thead>
        <tr>
            <th>Cliente</th>
            <th>Deuda Total</th>
            <th>Acción</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script src="admin.js"></script>
</body>
</html>
