<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Kiosco El Cholo</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #121212; color: #e0e0e0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #333; }
        h3 { color: #fbc02d; border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 30px; }
        
        .grid-reporte { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 20px 0; }
        .caja { background: #252525; padding: 20px; border-radius: 10px; text-align: center; border-left: 5px solid #fbc02d; }
        .caja b { font-size: 1.5rem; display: block; margin-top: 10px; color: #fff; }
        
        .total-dia { background: #fbc02d; color: #121212; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #252525; border-radius: 8px; overflow: hidden; }
        th { background: #333; color: #fbc02d; padding: 15px; text-align: left; font-size: 0.8rem; }
        td { padding: 15px; border-bottom: 1px solid #333; }
        
        input, select { background: #333; border: 1px solid #444; color: white; padding: 12px; border-radius: 6px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
        .btn-save { background: #fbc02d; color: #121212; border: none; font-weight: bold; cursor: pointer; padding: 12px; border-radius: 6px; width: 100%; }
        .btn-danger { background: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .btn-nav { background: #444; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-bottom: 20px; }
        
        .status-low { color: #ff5252; font-weight: bold; }
        .status-ok { color: #4caf50; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <button class="btn-nav" onclick="window.location.href='index.html'">⬅ VOLVER AL MOSTRADOR</button>

    <h3>📊 CIERRE DE CAJA DIARIO</h3>
    <div class="grid-reporte">
        <div class="caja"><p>💵 Efectivo</p><b id="total-efectivo">$0,00</b></div>
        <div class="caja"><p>💳 Tarjeta</p><b id="total-debito">$0,00</b></div>
        <div class="caja"><p>📱 QR / MP</p><b id="total-qr">$0,00</b></div>
    </div>
    <div class="total-dia">TOTAL DEL DÍA: <span id="total-general">$0,00</span></div>
    <button class="btn-danger" style="width: 100%;" onclick="borrarVentas()">🗑️ REINICIAR CAJA DIARIA</button>

    <h3>🔑 CONFIGURACIÓN NUBE</h3>
    <div style="background: #252525; padding: 15px; border-radius: 8px; border: 1px solid #444;">
        <input type="password" id="gh-token" placeholder="Token de GitHub">
        <div style="display: flex; gap: 10px;">
            <button class="btn-save" style="background: #444; color: white;" onclick="guardarToken()">Validar</button>
            <button class="btn-save" style="background: #222; color: white;" onclick="borrarToken()">Limpiar</button>
        </div>
        <small id="token-status"></small>
    </div>

    <h3>🆕 CARGAR PRODUCTO</h3>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <input type="text" id="admin-codigo" placeholder="Código / Escaneo" autofocus>
        <input type="number" id="admin-stock" placeholder="Stock Inicial">
        <input type="text" id="admin-nombre" placeholder="Nombre">
        <input type="number" id="admin-precio" placeholder="Precio $">
    </div>
    <select id="admin-tipo">
        <option value="fijo">Precio Fijo</option>
        <option value="variable">Precio Variable (Peso/Fiambre)</option>
    </select>
    <button id="btn-guardar" class="btn-save" onclick="guardarProducto()">💾 GUARDAR PRODUCTO</button>

    <h3>📋 INVENTARIO</h3>
    <table id="tabla-productos">
        <thead>
            <tr><th>Código</th><th>Producto</th><th>Precio</th><th>Stock</th><th>Acción</th></tr>
        </thead>
        <tbody></tbody>
    </table>

    <h3>👥 LIBRETA DE FIADOS</h3>
    <div style="display: flex; gap: 10px;">
        <input type="text" id="fiado-cliente" placeholder="Cliente">
        <input type="number" id="fiado-monto" placeholder="Monto $">
        <button class="btn-save" style="width: auto;" onclick="agregarFiado()">➕ ANOTAR</button>
    </div>
    <table id="tabla-fiados">
        <thead>
            <tr><th>Cliente</th><th>Deuda</th><th>Acción</th></tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script src="admin.js"></script>
</body>
</html>
