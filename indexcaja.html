<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> POS Profesional</title>
    <!-- Google Fonts: Outfit for titles, Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #131a26;
            --bg-tertiary: #1b2537;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #6366f1;
            /* Indigo */
            --accent-hover: #4f46e5;
            --success: #10b981;
            /* Emerald */
            --success-hover: #059669;
            --warning: #f59e0b;
            /* Amber */
            --danger: #ef4444;
            /* Rose */
            --danger-hover: #dc2626;
            --border-color: #2e3c51;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Encabezado */
        header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, #151e2e 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-svg {
            width: 48px;
            height: 48px;
            background: rgba(99, 102, 241, 0.15);
            border: 2px solid var(--accent-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.25);
        }

        .header-text h1 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #ffffff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-text p {
            margin: 2px 0 0 0;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .clock {
            font-family: 'Outfit', monospace;
            font-size: 1rem;
            color: var(--accent-primary);
            background: rgba(99, 102, 241, 0.08);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(99, 102, 241, 0.2);
            font-weight: 600;
        }

        #contenedor {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }

        /* Lado Izquierdo: Ventas y Búsqueda */
        #ventas {
            flex: 2;
            background: var(--bg-secondary);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .search-container {
            position: relative;
            margin-bottom: 5px;
        }

        input#codigo {
            width: 100%;
            padding: 16px 16px 16px 48px;
            font-size: 1.25rem;
            font-family: 'Inter', sans-serif;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-sizing: border-box;
            background: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
        }

        input#codigo:focus,
        input#cantidad-agregar:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
            transition: var(--transition);
        }

        input#codigo:focus+.search-icon {
            color: var(--accent-primary);
        }

        /* Sugerencias de búsqueda manual */
        .sugerencias-container {
            background: var(--bg-tertiary);
            border-radius: 0 0 12px 12px;
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            border-top: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            display: none;
        }

        .sugerencias-container.active {
            display: block;
        }

        .sugerencia-item {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            color: var(--text-primary);
            transition: var(--transition);
        }

        .sugerencia-item:last-child {
            border-bottom: none;
        }

        .sugerencia-item:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        .sugerencia-thumb {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            overflow: hidden;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .sugerencia-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sugerencia-name {
            font-weight: 500;
            flex: 1;
        }

        .sugerencia-price {
            color: var(--warning);
            font-weight: 600;
        }

        #lista-productos {
            flex: 1;
            overflow-y: auto;
            margin-top: 15px;
            border-radius: 8px;
        }

        .producto-fila {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding: 14px 12px;
            align-items: center;
            font-size: 1.05rem;
            transition: var(--transition);
            gap: 14px;
        }

        .producto-fila:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .prod-thumb {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            overflow: hidden;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .prod-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .prod-thumb-placeholder {
            font-size: 1.4rem;
        }

        .prod-info {
            flex: 2;
        }

        .prod-info strong {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .prod-info small {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 4px;
            display: inline-block;
        }

        .prod-subtotal {
            font-weight: 700;
            color: var(--text-primary);
            margin-right: 20px;
            font-size: 1.1rem;
        }

        /* Lado Derecho: Totales */
        #totales {
            flex: 1;
            background: var(--bg-secondary);
            padding: 28px;
            border-radius: 16px;
            border: 2px solid var(--accent-primary);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            overflow-y: auto;
        }

        .total-header {
            text-align: center;
        }

        .total-header h2 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .total-nro {
            font-family: 'Outfit', sans-serif;
            font-size: 3.2rem;
            color: var(--success);
            font-weight: 800;
            text-align: center;
            margin: 12px 0;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
        }

        .payment-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            padding: 14px;
            font-size: 1rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            width: 100%;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-weight: 500;
            outline: none;
            cursor: pointer;
            transition: var(--transition);
        }

        select:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .caja-vuelto {
            background: rgba(245, 158, 11, 0.05);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(245, 158, 11, 0.2);
            margin-top: 4px;
        }

        .caja-vuelto input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            font-size: 1.1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-weight: 600;
            box-sizing: border-box;
            outline: none;
            transition: var(--transition);
        }

        .caja-vuelto input:focus {
            border-color: var(--warning);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        .vuelto-text {
            margin: 12px 0 0 0;
            font-size: 1.25rem;
            text-align: center;
            font-weight: 600;
        }

        #vuelto-display {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
        }

        .btn {
            font-family: 'Outfit', sans-serif;
            border: none;
            padding: 16px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 10px;
            width: 100%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-finalizar {
            background: var(--success);
            color: #ffffff;
            margin-top: 10px;
        }

        .btn-finalizar:hover {
            background: var(--success-hover);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }

        .btn-fiado {
            background: var(--accent-primary);
            color: white;
        }

        .btn-fiado:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        .btn-cancelar {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 10px;
            font-size: 0.95rem;
        }

        .btn-cancelar:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .btn-eliminar {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: var(--transition);
        }

        .btn-eliminar:hover {
            background: var(--danger);
            color: white;
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--text-secondary);
            text-decoration: underline;
            cursor: pointer;
            margin-top: 10px;
            font-size: 0.9rem;
            width: 100%;
            transition: var(--transition);
            font-weight: 500;
        }

        .btn-link:hover {
            color: var(--accent-primary);
        }

        /* Control de Tickets e Impresora Térmica */
        .ticket-control-box {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ticket-checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            user-select: none;
        }

        .ticket-checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent-primary);
        }

        .ticket-actions-row {
            display: flex;
            gap: 8px;
        }

        .btn-ticket-action {
            flex: 1;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 6px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-ticket-action:hover {
            background: var(--accent-primary);
            color: #ffffff;
            border-color: var(--accent-primary);
            transform: translateY(-1px);
        }

        /* Toast Notificación flotante de Venta */
        .toast-notificacion {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--success);
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10000;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .toast-notificacion.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Responsivo */
        @media (max-width: 900px) {
            #contenedor {
                flex-direction: column;
                overflow-y: auto;
            }

            #ventas,
            #totales {
                flex: none;
                height: auto;
            }

            body {
                overflow-y: auto;
            }
        }

        /* Modal Catálogo */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 23, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            width: 92%;
            max-width: 940px;
            height: 84vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            animation: slideUp 0.2s ease-out;
            overflow: hidden;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .modal-header h3 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            color: var(--warning);
            font-size: 1.35rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.8rem;
            cursor: pointer;
            transition: var(--transition);
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--danger);
        }

        .modal-body {
            padding: 20px 24px;
            overflow: hidden;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        /* Banner Producto Fichado en Vivo */
        .banner-fichado {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(19, 26, 38, 0.98));
            border: 1.5px solid var(--accent-primary);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 15px;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.25);
            display: flex;
            align-items: center;
            gap: 16px;
            animation: fichadoFlash 0.35s ease-out;
            transition: all 0.3s ease;
        }

        @keyframes fichadoFlash {
            0% {
                transform: scale(0.96);
                box-shadow: 0 0 25px var(--accent-primary);
            }

            50% {
                transform: scale(1.02);
            }

            100% {
                transform: scale(1);
            }
        }

        .banner-fichado-img-box {
            width: 58px;
            height: 58px;
            border-radius: 10px;
            overflow: hidden;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .banner-fichado-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .banner-fichado-info {
            flex: 1;
            min-width: 0;
        }

        .banner-fichado-badge {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--accent-primary);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 3px;
        }

        .banner-fichado-info h4 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .banner-fichado-detalles {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .fichado-tag {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-family: monospace;
        }

        .fichado-precio {
            font-weight: 700;
            color: var(--success);
            font-size: 1.05rem;
        }

        .fichado-cant {
            font-size: 0.85rem;
            color: var(--warning);
            background: rgba(245, 158, 11, 0.1);
            padding: 2px 6px;
            border-radius: 6px;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        /* Tarjeta Carta Digital */
        .grid-catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            grid-auto-rows: max-content;
            align-content: start;
            gap: 16px;
            overflow-y: auto;
            overflow-x: hidden;
            flex: 1;
            min-height: 0;
            padding: 4px 8px 14px 2px;
        }

        .tarjeta-producto {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .tarjeta-producto:hover {
            border-color: var(--accent-primary);
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(99, 102, 241, 0.25);
        }

        .tarjeta-img-container {
            width: 100%;
            height: 130px;
            flex-shrink: 0;
            background: linear-gradient(145deg, #0d131f 0%, #162033 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid var(--border-color);
        }

        .tarjeta-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .tarjeta-producto:hover .tarjeta-img-container img {
            transform: scale(1.06);
        }

        .tarjeta-img-placeholder {
            font-size: 2.6rem;
            opacity: 0.75;
        }

        .tarjeta-producto-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
            gap: 12px;
        }

        .tarjeta-producto-info strong {
            display: block;
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            color: var(--text-primary);
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .tarjeta-producto-info span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: monospace;
            word-break: break-all;
        }

        .tarjeta-producto-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            gap: 8px;
        }

        .tarjeta-producto-precio {
            color: var(--warning);
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            white-space: nowrap;
        }

        .tarjeta-btn-add {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.35);
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 6px 12px;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .tarjeta-producto:hover .tarjeta-btn-add {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .tarjeta-producto-stock {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 0.75rem;
            padding: 4px 9px;
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.4);
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .stock-bajo {
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.5);
            background: rgba(127, 29, 29, 0.85);
        }
    </style>
</head>

<body>

    <header>
        <div class="header-left">
            <div class="logo-svg">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                    <path d="M3 6h18" />
                    <path d="M16 10a4 4 0 0 1-8 0" />
                </svg>
            </div>
            <div class="header-text">
                <h1>PUNTO DE VENTA</h1>
                <p>Sistema de Gestión de Ventas & POS</p>
            </div>
        </div>
        <div class="header-right">
            <a href="carta.html" target="_blank" style="text-decoration: none; display: flex; align-items: center; gap: 6px; background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 0.88rem; transition: var(--transition);">
                📲 Ver Carta WhatsApp
            </a>
            <a href="admin.html" style="text-decoration: none; display: flex; align-items: center; gap: 6px; background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 0.88rem; transition: var(--transition);">
                ⚙️ Panel Admin
            </a>
            <div id="reloj" class="clock">00:00:00</div>
        </div>
    </header>

    <div id="contenedor">
        <!-- SECCIÓN IZQUIERDA: CARGA DE PRODUCTOS -->
        <div id="ventas">
            <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                <div style="display: flex; flex-direction: column; gap: 6px; width: 110px; flex-shrink: 0;"
                    title="Cantidad de productos a agregar">
                    <input type="number" id="cantidad-agregar" min="1" value="1"
                        style="padding: 16px; font-size: 1.25rem; font-family: 'Inter', sans-serif; border: 2px solid var(--border-color); border-radius: 12px; background: var(--bg-primary); color: var(--text-primary); text-align: center; font-weight: 700; outline: none; box-sizing: border-box; transition: var(--transition);"
                        onfocus="this.select()">
                </div>
                <div class="search-container" style="flex: 1; margin-bottom: 0;">
                    <input type="text" id="codigo" placeholder="Escaneá código de barras o escribí nombre..." autofocus
                        autocomplete="off">
                    <div class="search-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.3-4.3" />
                        </svg>
                    </div>
                </div>
            </div>

            <!-- BOTÓN CARTA DIGITAL / CATÁLOGO -->
            <button id="btn-ver-catalogo" onclick="abrirModalCatalogo()"
                style="margin-bottom: 12px; background: var(--bg-tertiary); color: var(--warning); border: 1px solid var(--border-color); padding: 14px; font-size: 1.05rem; font-family: 'Outfit', sans-serif; font-weight: 600; border-radius: 12px; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; transition: var(--transition);">
                📖 CARTA DIGITAL / CATÁLOGO DE PRODUCTOS
            </button>

            <!-- BANNER VISUAL DE PRODUCTO FICHADO -->
            <div id="banner-ultimo-fichado" class="banner-fichado" style="display: none;">
                <div class="banner-fichado-img-box" id="fichado-img-box">
                    <span style="font-size: 1.6rem;">🛍️</span>
                </div>
                <div class="banner-fichado-info">
                    <div class="banner-fichado-badge">
                        <span>✨</span> PRODUCTO FICHADO EN CAJA
                    </div>
                    <h4 id="fichado-nombre">Producto</h4>
                    <div class="banner-fichado-detalles">
                        <span id="fichado-codigo" class="fichado-tag">Cód: 000</span>
                        <span id="fichado-precio" class="fichado-precio">$0,00</span>
                        <span id="fichado-cant" class="fichado-cant">x 1</span>
                        <span id="fichado-subtotal"
                            style="font-weight: 700; color: var(--text-primary); font-size: 0.95rem;">= $0,00</span>
                    </div>
                </div>
            </div>

            <!-- Sugerencias de búsqueda manual -->
            <div id="lista-sugerencias" class="sugerencias-container"></div>

            <div id="lista-productos">
                <p
                    style="color: var(--text-secondary); text-align: center; margin-top: 60px; font-style: italic; font-size: 1.1rem;">
                    Esperando lectura de código o entrada de producto...
                </p>
            </div>
        </div>

        <!-- SECCIÓN DERECHA: COBRO Y TOTALES -->
        <div id="totales">
            <div class="total-header">
                <h2>Total a Cobrar</h2>
                <div class="total-nro" id="total-display">$0,00</div>
            </div>

            <div class="payment-section">
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label>Medio de Pago</label>
                    <select id="metodo-pago">
                        <option value="efectivo">💵 Efectivo</option>
                        <option value="debito">💳 Débito / Crédito</option>
                        <option value="qr">📱 Mercado Pago / QR</option>
                    </select>
                </div>

                <div class="caja-vuelto">
                    <label>💰 Paga con</label>
                    <input type="number" id="paga-con" oninput="calcularVuelto()" placeholder="Ej: 5000">
                    <p class="vuelto-text">
                        Vuelto: <span id="vuelto-display" style="color: var(--text-primary);">$0,00</span>
                    </p>
                </div>

                <!-- CONTROL DE IMPRESIÓN DE TICKET (GADNIC IT1050) -->
                <div class="ticket-control-box">
                    <label class="ticket-checkbox-label"
                        title="Al finalizar la venta, se abrirá la vista de impresión para tu Gadnic IT1050">
                        <input type="checkbox" id="check-imprimir-ticket" checked
                            onchange="toggleAutoImprimir(this.checked)">
                        <span>🖨️ Imprimir ticket al cobrar</span>
                    </label>
                    <div class="ticket-actions-row">
                        <button type="button" class="btn-ticket-action" onclick="imprimirTicketPrueba()"
                            title="Imprimir ticket de prueba en la Gadnic IT1050">
                            🧪 Ticket Prueba
                        </button>
                        <button type="button" class="btn-ticket-action" onclick="reimprimirUltimoTicket()"
                            title="Reimprimir el ticket de la última venta">
                            📄 Reimprimir
                        </button>
                    </div>
                </div>

                <button class="btn btn-finalizar" onclick="finalizarVenta()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 6 9 17l-5-5" />
                    </svg>
                    FINALIZAR VENTA
                </button>

                <button class="btn btn-fiado" onclick="enviarAFiado()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9" />
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
                    </svg>
                    ANOTAR EN FIADOS
                </button>

                <button class="btn btn-cancelar" onclick="cancelarCarrito()">
                    🚫 Cancelar Carrito
                </button>

                <button onclick="window.location.href='admin.html'" class="btn-link">
                    ⚙️ Ir a Panel de Administración
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL DE CATÁLOGO / CARTA DIGITAL -->
    <div id="modal-catalogo" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📖 Carta Digital / Catálogo de Productos</h3>
                <button class="modal-close" onclick="cerrarModalCatalogo()">×</button>
            </div>
            <div class="modal-body">
                <div class="search-container" style="margin-bottom: 12px; position: relative; flex-shrink: 0;">
                    <input type="text" id="filtro-catalogo" placeholder="Buscar por nombre o código en la carta..."
                        oninput="filtrarCatalogo()"
                        style="width: 100%; box-sizing: border-box; padding: 12px 14px 12px 42px; font-size: 1rem; border: 2px solid var(--border-color); border-radius: 10px; background: var(--bg-primary); color: var(--text-primary); outline: none;">
                    <div class="search-icon"
                        style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.3-4.3" />
                        </svg>
                    </div>
                </div>
                <div id="categorias-catalogo" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 12px; flex-shrink: 0;"></div>
                <div class="grid-catalogo" id="grid-catalogo-productos">
                    <!-- Se llena dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notificación Flotante -->
    <div id="toast-notificacion" class="toast-notificacion"></div>

    <script src="api.js"></script>
    <script src="ticket.js"></script>
    <script src="script.js"></script>
    <script>
        // Reloj digital en la cabecera
        function actualizarReloj() {
            const ahora = new Date();
            const hrs = String(ahora.getHours()).padStart(2, '0');
            const mins = String(ahora.getMinutes()).padStart(2, '0');
            const segs = String(ahora.getSeconds()).padStart(2, '0');
            document.getElementById('reloj').innerText = `${hrs}:${mins}:${segs}`;
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        let categoriaActivaCatalogo = 'TODAS';

        function renderizarCategoriasCatalogo() {
            const cont = document.getElementById('categorias-catalogo');
            if (!cont) return;
            const cats = ['TODAS', ...new Set(productosDB.map(p => p.categoria).filter(Boolean))];
            cont.innerHTML = cats.map(c => `
                <button type="button" onclick="seleccionarCategoriaCatalogo('${c}')" style="
                    padding: 6px 14px;
                    border-radius: 20px;
                    font-size: 0.85rem;
                    font-weight: 600;
                    white-space: nowrap;
                    cursor: pointer;
                    background: ${categoriaActivaCatalogo === c ? 'var(--accent-primary)' : 'var(--bg-tertiary)'};
                    color: ${categoriaActivaCatalogo === c ? '#fff' : 'var(--text-secondary)'};
                    border: 1px solid ${categoriaActivaCatalogo === c ? 'var(--accent-primary)' : 'var(--border-color)'};
                    transition: var(--transition);
                ">${c}</button>
            `).join('');
        }

        function seleccionarCategoriaCatalogo(cat) {
            categoriaActivaCatalogo = cat;
            renderizarCategoriasCatalogo();
            renderizarCatalogo();
        }

        // Funciones del Catálogo Modal
        function abrirModalCatalogo() {
            document.getElementById('modal-catalogo').style.display = 'flex';
            document.getElementById('filtro-catalogo').value = '';
            categoriaActivaCatalogo = 'TODAS';
            renderizarCategoriasCatalogo();
            renderizarCatalogo();
            setTimeout(() => document.getElementById('filtro-catalogo').focus(), 50);
        }

        function cerrarModalCatalogo() {
            document.getElementById('modal-catalogo').style.display = 'none';
            const input = document.getElementById('codigo');
            if (input) input.focus();
        }

        function renderizarCatalogo() {
            const grid = document.getElementById('grid-catalogo-productos');
            if (!grid) return;
            grid.innerHTML = '';

            const filtro = (document.getElementById('filtro-catalogo')?.value || '').trim().toUpperCase();

            // Filtrar productos por búsqueda y por categoría
            let productosFiltrados = productosDB.filter(p => {
                const coincideTexto = !filtro ||
                    (p.nombre && p.nombre.toUpperCase().includes(filtro)) ||
                    (p.id && p.id.toUpperCase().includes(filtro)) ||
                    (p.categoria && p.categoria.toUpperCase().includes(filtro));
                const coincideCat = categoriaActivaCatalogo === 'TODAS' || p.categoria === categoriaActivaCatalogo;
                return coincideTexto && coincideCat;
            });

            if (productosFiltrados.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); margin-top: 40px;">No se encontraron platos o productos con ese criterio.</div>`;
                return;
            }

            // Ordenar alfabéticamente
            productosFiltrados.sort((a, b) => a.nombre.localeCompare(b.nombre));

            productosFiltrados.forEach(p => {
                const esVariable = p.tipo === "variable";
                const stockText = esVariable ? "Por Peso / Kilo" : `Stock: ${p.stock !== undefined ? p.stock : 999}`;
                const isBajo = !esVariable && (p.stock !== undefined && p.stock <= 3);
                const stockClass = isBajo ? 'stock-bajo' : '';
                const precioNum = parseFloat(String(p.precio).replace(/[^\d.]/g, '')) || 0;
                const precioText = esVariable ? "Por Kilo / Var." : `$${precioNum.toLocaleString('es-AR')}`;

                const imgHtml = p.imagen
                    ? `<img src="${p.imagen}" alt="${p.nombre}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'tarjeta-img-placeholder\\'>🍽️</div>'">`
                    : `<div class="tarjeta-img-placeholder">🍽️</div>`;

                grid.innerHTML += `
                <div class="tarjeta-producto" onclick="seleccionarProductoCatalogo('${p.id}')">
                    <div class="tarjeta-img-container">
                        ${imgHtml}
                        <span class="tarjeta-producto-stock ${stockClass}">${stockText}</span>
                    </div>
                    <div class="tarjeta-producto-body">
                        <div class="tarjeta-producto-info">
                            <strong>${p.nombre}</strong>
                            <span>${p.categoria || ''} • Cód: ${p.id}</span>
                        </div>
                        <div class="tarjeta-producto-meta">
                            <span class="tarjeta-producto-precio">${precioText}</span>
                            <button class="tarjeta-btn-add" type="button">+ Cobrar</button>
                        </div>
                    </div>
                </div>
            `;
            });
        }

        function filtrarCatalogo() {
            renderizarCatalogo();
        }

        function seleccionarProductoCatalogo(codigo) {
            procesarEscaneo(codigo);
            cerrarModalCatalogo();
        }
    </script>
</body>

</html>
